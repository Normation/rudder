[package]
name = "rudder_module_type"
version = "0.0.0-dev"
description = "Implement configuration module types for Rudder"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", optional = true }
gumdrop = "0.8"
rudder_commons = { path = "../rudder-commons" }
rudder_cli = { path = "../rudder-cli" }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std", "unstable-locales"] }
fnv = { version ="1.0.7", optional = true }
uuid = { version = "1.19.0", features = ["v4"] }
skip_bom = "0.5.1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[features]
default = ["backup"]
# Enable file backup helpers
backup = ["chrono"]
diff = ["dep:similar"]
splay = ["dep:fnv"]
