[package]
name = "lib"
version = "0.0.0-dev"
description = "Methods library"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
rudderc = { path = "../rudderc" }
agent = { path = "../agent" }
rudder_commons = { path = "../rudder-commons" }

[dev-dependencies]
anyhow = "1.0.93"
indexmap = "2.12.0"
itertools = "0.15.0"
regex = "1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.133"
serde_yaml = "0.9.34"
tempfile = "3.14.0"
test-log = "0.2.21"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[target.'cfg(unix)'.dev-dependencies]
posix-acl = "1.2.0"
uzers = "0.12.1"

[features]
default = ["agent/test-unix"]
test-windows = ["agent/test-windows"]
test-unix = ["agent/test-unix"]
