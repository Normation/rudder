[package]
name = "rudder-mcp"
version = "0.1.0"
description = "Rudder MCP server"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true


[dependencies]
anyhow = "1.0.104"
axum = "0.8"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.1", default-features = false, features = ["native-tls", "query"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rudder-module-template = { path = "../policies/module-types/template" }
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "time"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


[dev-dependencies]
pretty_assertions = "1"
