# Rudder MCP server configuration (TOML)
#
# Every setting is optional, values below are the defaults.

[server]
# Address the MCP endpoint (/mcp) listens on
#listen = "127.0.0.1:3031"

[api]
# Rudder server URL. Plain http is only accepted for the local server, as API tokens are sent to it.
#url = "http://127.0.0.1:8080"
