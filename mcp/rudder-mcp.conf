# Rudder MCP server configuration (TOML)
#
# Every setting is optional, values below are the defaults.
# Logging is set with the RUST_LOG environment variable (default: info).

[server]
# Address the MCP endpoint (/mcp) listens on
#listen = "127.0.0.1:8000"
# Only offer read-only tools. Set to false to also offer write tools: callers still need the
# rights on their Rudder API token to use them.
#read_only = true

[api]
# Rudder API base URL, https only (caller tokens are sent to it)
#url = "https://localhost/rudder/api/latest"
# Disable TLS certificate verification, e.g. for the self-signed certificate of a default
# install. Forwarded tokens can then be intercepted.
#tls_skip_verify = false

[rudderc]
# rudderc binary, used to compile techniques
#path = "/opt/rudder/bin/rudderc"
