# Rudder MCP server logging configuration (TOML)
#
# Every setting is optional, values below are the defaults.

[general]
# Global log level: "off", "error", "warn", "info", "debug" or "trace"
#level = "info"
# Additional comma-separated filters, by component, e.g. "rudder_mcp=debug,rmcp=trace"
#filter = ""
