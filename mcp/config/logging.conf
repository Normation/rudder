# Rudder MCP server logging configuration (TOML)
#
# Every setting is optional, values below are the defaults.

[general]
# Global log level: "off", "error", "warn", "info", "debug" or "trace"
#level = "info"

# Additional comma-separated filters, overriding the level:
#
# * By component, "<component>=<level>":
#   - "rudder_mcp": this server. "rudder_mcp::auth" logs the requests (account, MCP method and
#     tool, HTTP status, duration) and the refused requests, "rudder_mcp::api" the calls to the
#     Rudder API, at debug.
#   - "rmcp": the MCP library.
#   - "reqwest", "hyper_util": the HTTP client calling the Rudder API, at debug.
#   For example, only the request log: level = "warn" and filter = "rudder_mcp::auth=info".
#
# * By span, "[<span>]=<level>" or "[<span>{<field>=<value>}]=<level>": everything logged in the
#   span, whatever the component, rmcp and the HTTP client included.
#   - "mcp_request": one request. Fields "client" (address), "mcp_method", "mcp_name" (tool), and
#     once the token is accepted "account" (API account id) and "rights" ("ro", "rw", "acl"...).
#   - "token_check": the check of the request's token with Rudder.
#   - "rudder_api": one Rudder API call. Fields "method" and "path".
#   For example, the debug logs of one account's requests:
#   "rmcp=warn,[mcp_request{account=<account id>}]=debug".
#
# The default keeps rmcp to warnings: add "rmcp=warn" to a filter you set to keep it that way.
#filter = "rmcp=warn"
