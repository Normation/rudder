# Rudder MCP server configuration (TOML)
#
# Every setting is optional, values below are the defaults.
# Logging is set in logging.conf, in the same directory.
#

[server]
# Address the MCP endpoint (/mcp) listens on
#listen = "127.0.0.1:3031"

[api]
# Rudder server URL, possibly with a path prefix, e.g. "https://proxy.example.com/rudder-paris"
# when behind a reverse proxy. The API is called under <url>/rudder/api/latest. Plain http is only
# accepted for the local server, as API tokens are sent to it.
#url = "http://127.0.0.1:8080"
