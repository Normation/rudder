# Rudder MCP server, served at https://<server>/rudder/mcp
#
# Included by rudder-apache-webapp-ssl.conf, before its ProxyPass for all of /rudder:
# the first matching ProxyPass wins.

# Port from [server] listen in /opt/rudder/etc/rudder-mcp/main.conf
ProxyPass "/rudder/mcp" "http://127.0.0.1:3031/mcp" retry=0

<Location /rudder/mcp>
  # Send the MCP server's own errors (JSON-RPC bodies, 401) to clients, not Apache error pages
  ProxyErrorOverride Off
</Location>

# Requests are authenticated by the MCP server, with the caller's Rudder API token
<Proxy http://127.0.0.1:3031/mcp>
  Require all granted
</Proxy>
