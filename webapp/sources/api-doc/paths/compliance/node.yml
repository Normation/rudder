get:
  summary: Compliance details by node
  description:
    'Get current compliance of a node of a Rudder server.
    
    
    This endpoint is deprecated and will be removed in version 10; use endpoint /nodes/{nodeId}/compliance instead.'
  operationId: getNodeComplianceOld
  parameters:
    - $ref: ../../components/parameters/compliance-level.yml
    - $ref: ../../components/parameters/compliance-percent-precision.yml
    - $ref: ../../components/parameters/node-id.yml
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
              - result
              - action
              - data
            properties:
              result:
                type: string
                description: Result of the request
                enum:
                  - success
                  - error
                example: success
              action:
                type: string
                description: The id of the action
                enum:
                  - getNodeCompliance
              data:
                type: object
                required:
                  - nodes
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: ../../components/schemas/node-compliance.yml
  tags:
    - Compliance
  x-codeSamples:
    - lang: curl
      source:
        $ref: ../../code_samples/curl/compliance/node.sh
