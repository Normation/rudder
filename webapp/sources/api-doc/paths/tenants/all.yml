get:
  summary: List tenants
  description: List the declared tenants, enabled or not. The special values `*` and `-` of account tenants are not tenants and are not listed.
  operationId: getTenants
  responses:
    "200":
      description: Tenants
      content:
        application/json:
          schema:
            type: object
            required:
              - result
              - action
              - data
            properties:
              result:
                type: string
                description: Result of the request
                enum:
                  - success
                  - error
              action:
                type: string
                description: The id of the action
                enum:
                  - getTenants
              data:
                type: object
                required:
                  - tenants
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: ../../components/schemas/tenant.yml
  tags:
    - 🧩 Multi-tenants
  x-codeSamples:
    - lang: curl
      source:
        $ref: ../../code_samples/curl/tenants/all.sh
post:
  summary: Add tenants
  description: >-
    Add the given tenants. A tenant with the id of an existing one replaces it. Every id is checked first: if one is invalid,
    nothing is changed.
  operationId: addTenants
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/tenant.yml
  responses:
    "200":
      description: Ids of the added or replaced tenants
      content:
        application/json:
          schema:
            type: object
            required:
              - result
              - action
              - data
            properties:
              result:
                type: string
                description: Result of the request
                enum:
                  - success
                  - error
              action:
                type: string
                description: The id of the action
                enum:
                  - addTenants
              data:
                type: object
                required:
                  - tenants
                properties:
                  tenants:
                    type: array
                    items:
                      type: string
                      description: Tenant id
  tags:
    - 🧩 Multi-tenants
  x-codeSamples:
    - lang: curl
      source:
        $ref: ../../code_samples/curl/tenants/add.sh
delete:
  summary: Delete tenants
  description: >-
    Delete the tenants with the given ids. Unknown ids are ignored. Objects keep the deleted tenants in their tags, and
    accounts in their tenants: declaring a tenant with the same id gives them back their meaning.
  operationId: deleteTenants
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            description: Tenant id
          example: ["zone-1", "zone-2"]
  responses:
    "200":
      description: Ids of the deleted tenants
      content:
        application/json:
          schema:
            type: object
            required:
              - result
              - action
              - data
            properties:
              result:
                type: string
                description: Result of the request
                enum:
                  - success
                  - error
              action:
                type: string
                description: The id of the action
                enum:
                  - deleteTenants
              data:
                type: object
                required:
                  - tenants
                properties:
                  tenants:
                    type: array
                    items:
                      type: string
                      description: Tenant id
  tags:
    - 🧩 Multi-tenants
  x-codeSamples:
    - lang: curl
      source:
        $ref: ../../code_samples/curl/tenants/delete.sh
