type: object
required:
  - id
  - name
  - compliance
  - policyMode
  - complianceDetails
properties:
  id:
    type: string
    format: uuid
    description: id of the rule
    example: 835c068d-f01e-44c0-a0f4-7a436d46ad35
  name:
    type: string
    description: Name of the rule
    example: Test users
  compliance:
    type: number
    format: float
    description: Rule compliance level
    example: 100.0
  policyMode:
    type: string
    enum:
      - default
      - audit
      - enforce
    description: Policy mode of the rule
    example: audit
  complianceDetails:
    type: object
    properties:
      successAlreadyOK:
        type: number
        format: float
        example: 66.67
      noReport:
        type: number
        format: float
        example: 0.0
      successNotApplicable:
        type: number
        format: float
        example: 33.33
      unexpectedMissingComponent:
        type: number
        format: float
        example: 0.0
      error:
        type: number
        format: float
        example: 0.0
      unexpectedUnknownComponent:
        type: number
        format: float
        example: 0.0
      successRepaired:
        type: number
        format: float
        example: 0.0
  directives:
    # SPDX-License-Identifier: CC-BY-SA-2.0
    # SPDX-FileCopyrightText: 2013-2024 Normation SAS
    type: object
    required:
      - id
      - name
      - compliance
      - policyMode
      - complianceDetails
    properties:
      id:
        type: string
        format: uuid
        description: id of the directive
        example: 9a1773c9-0889-40b6-be89-f6504443ac1b
      name:
        type: string
        description: Name of the directive
        example: test directive
      compliance:
        type: number
        format: float
        description: Directive compliance level
        example: 83.34
      policyMode:
        type: string
        enum:
          - default
          - audit
          - enforce
        description: Policy mode of the directive
        example: audit
      complianceDetails:
        type: object
        properties:
          successAlreadyOK:
            type: number
            format: float
            example: 66.68
          noReport:
            type: number
            format: float
            example: 7.45
          successNotApplicable:
            type: number
            format: float
            example: 16.66
          unexpectedMissingComponent:
            type: number
            format: float
            example: 2.63
          error:
            type: number
            format: float
            example: 1.32
          unexpectedUnknownComponent:
            type: number
            format: float
            example: 2.63
          successRepaired:
            type: number
            format: float
            example: 2.63
      components:
        type: array
        items:
          $ref: 'component-status-report.yml'
