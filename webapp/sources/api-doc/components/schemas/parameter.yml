type: object
required:
  - id
properties:
  # FIXME: required on not depends on where it's used
  id:
    type: string
    description: Name of the parameter
    example: rudder_file_edit_footer
  value:
    format: string or JSON
    example: "### End of file managed by Rudder ###"
    description: Value of the parameter
  description:
    type: string
    example: "Default inform message put in footer of managed files by Rudder"
    description: Description of the parameter
  inheritMode:
    type: string
    pattern: "^[mo][oap][oap]$"
    description: >-
      How a value overriding this parameter in a group or on a node is combined with it, as three characters for objects
      (`m`erge, `o`verride), arrays and strings (`o`verride, `a`ppend, `p`repend),
      unless the overriding value sets its own. When absent, the default `moo` applies.
    example: moo

  security:
    $ref: security-tag.yml
    description: >-
      Tenants of the technique (requires the `multi-tenants` plugin), with the values described in the security tag schema.
