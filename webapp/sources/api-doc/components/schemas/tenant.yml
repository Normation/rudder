type: object
required:
  - id
  - name
  - description
  - documentation
  - enabled
properties:
  id:
    type: string
    description: Unique identifier of the tenant
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
    example: zone-1
  name:
    type: string
    description: A name for humans
    example: "Zone 1"
  description:
    type: string
    description: One line description of the tenant
    example: "Nodes of the European geo zone"
  documentation:
    type: string
    description: A long form description of the tenant, accepting markdown
    example: "zone-1 holds the nodes of the European geo zone. The region is split as: ..."
  enabled:
    type: boolean
    description: >-
      Only enabled tenants are declared to Rudder: a disabled tenant is removed from the tenants granted to an API call
      until it is enabled again. Objects keep it in their tags.
    example: true
