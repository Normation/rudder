type: object
required:
  - id
  - name
  - compliance
  - mode
  - policyMode
  - complianceDetails
properties:
  id:
    type: string
    format: uuid
    description: id of the node
    example: f37f4928-fcb5-4acf-a422-d40f123a9670
  name:
    type: string
    description: node name
    example: server.rudder.local
  compliance:
    type: number
    format: float
    description: Rule compliance level
    example: 57.43
  mode:
    type: string
    enum:
      - full-compliance
      - changes-only
      - reports-disabled
  policyMode:
    type: string
    enum:
      - default
      - audit
      - enforce
    description: Policy mode of the directive
    example: audit
  complianceDetails:
    $ref: ../../components/schemas/compliance-details.yml
  rules:
    type: array
    items:
      $ref: ../../components/schemas/rule-compliance-directive.yml
