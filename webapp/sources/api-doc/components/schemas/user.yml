type: object
required:
  - login
  - otherInfo
  - status
  - authz
  - permissions
  - rolesCoverage
  - customRights
  - providers
  - providersInfo
properties:
  login:
    type: string
    example: johndoe
  name:
    type: string
    example: John Doe
  email:
    type: string
    example: john.doe@example.com
  otherInfo:
    type: object
    additionalProperties:
      type: string
    example:
      phone: "+12345"
  status:
    type: string
    enum:
      - active
      - deleted
      - disabled
  authz:
    type: array
    items:
      $ref: right.yml
  permissions:
    type: array
    items:
      type: string
      example: inventory
  rolesCoverage:
    type: array
    items:
      type: string
      example: inventory
  customRights:
    type: array
    items:
      $ref: right.yml
  providers:
    type: array
    items:
      type: string
      example: file
  providersInfo:
    type: object
    properties:
      provider:
        type: string
        example: file
      authz:
        type: array
        items:
          $ref: right.yml
      roles:
        type: array
        items:
          type: string
          example: inventory
      customRights:
        type: array
        items:
          $ref: right.yml
  tenants:
    type: string
    readOnly: true
    description: >-
      Tenants of the user (requires the `multi-tenants` plugin): `all`, `none`, or a comma separated list of tenant ids, each one
      followed by `:r` when the access is read only. They are set in the users file or by the identity provider.
    example: zone-1,zone-2:r
  lastLogin:
    type: string
    format: date-time
