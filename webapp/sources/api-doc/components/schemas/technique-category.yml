type: object
required:
  - name
  - description
  - path
  - id
  - subCategories
properties:
  name:
    type: string
    description: Category's name
    example: User Techniques
  description:
    type: string
    description: Category's description
    example: Techniques created using the Technique editor.
  path:
    type: string
    description: Category path from the library root
    example: systemSettings/systemManagement
  id:
    type: string
    description: Category ID (by default the name of its directory in the configuration repository)
    example: systemManagement
  subCategories:
    type: array
    description: List of sub categories
    example: []
    items:
      $ref: './technique-category.yml'
