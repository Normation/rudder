---
description: Refuse an empty name on update
method: POST
url: /api/latest/techniques/categories
body: >-
  {
    "action": "update",
    "path": "ncf_techniques/linux_hardening",
    "name": "  "
  }
response:
  code: 500
  content: >-
    {
      "action" : "saveTechniqueCategory",
      "result" : "error",
      "errorDetails" : "The name of a category can not be empty"
    }
---
description: Delete a technique category
method: DELETE
url: /api/latest/techniques/categories
comment: the path goes in `params` and not in the url, and the form content type is what makes the test harness pass it on a DELETE
headers:
  - "Content-Type: application/x-www-form-urlencoded"
params:
  path: "ncf_techniques/linux_hardening"
response:
  code: 200
  content: >-
    {
      "action" : "deleteTechniqueCategory",
      "result" : "success",
      "data" : {
        "techniqueCategories" : [
          {
            "id" : "linux_hardening",
            "path" : "ncf_techniques/linux_hardening"
          }
        ]
      }
    }
