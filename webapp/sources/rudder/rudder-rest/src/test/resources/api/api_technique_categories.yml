description: Create a technique category
method: POST
url: /api/latest/techniques/categories
body: >-
  {
    "action": "create",
    "parent": "ncf_techniques",
    "name": "Linux hardening",
    "description": "Linux default hardening"
  }
response:
  code: 200
  content: >-
    {
      "action" : "saveTechniqueCategory",
      "result" : "success",
      "data" : {
        "techniqueCategories" : [
          {
            "name" : "Linux hardening",
            "description" : "Linux default hardening",
            "path" : "ncf_techniques/linux_hardening",
            "id" : "linux_hardening",
            "subCategories" : []
          }
        ]
      }
    }
---
description: Refuse a creation whose name leads to an already used ID
method: POST
url: /api/latest/techniques/categories
body: >-
  {
    "action": "create",
    "parent": "ncf_techniques",
    "name": "LINUX Hardening!",
    "description": "same ID as the previous one"
  }
response:
  code: 500
  content: >-
    {
      "action" : "saveTechniqueCategory",
      "result" : "error",
      "errorDetails" : "A category with directory name 'linux_hardening' already exists at 'ncf_techniques/linux_hardening': directory names must be unique in the whole technique library"
    }
---
description: Refuse a creation outside of the technique editor categories
method: POST
url: /api/latest/techniques/categories
body: >-
  {
    "action": "create",
    "parent": "systemSettings",
    "name": "Not there",
    "description": ""
  }
response:
  code: 500
  content: >-
    {
      "action" : "saveTechniqueCategory",
      "result" : "error",
      "errorDetails" : "Category '/systemSettings' is not under 'ncf_techniques': only the categories of the technique editor can be managed here"
    }
---
description: Update the name and the description of a category
method: POST
url: /api/latest/techniques/categories
body: >-
  {
    "action": "update",
    "path": "ncf_techniques/linux_hardening",
    "name": "Linux hardening (CIS)",
    "description": "Following the CIS benchmark"
  }
response:
  code: 200
  content: >-
    {
      "action" : "saveTechniqueCategory",
      "result" : "success",
      "data" : {
        "techniqueCategories" : [
          {
            "name" : "Linux hardening (CIS)",
            "description" : "Following the CIS benchmark",
            "path" : "ncf_techniques/linux_hardening",
            "id" : "linux_hardening",
            "subCategories" : []
          }
        ]
      }
    }
---
