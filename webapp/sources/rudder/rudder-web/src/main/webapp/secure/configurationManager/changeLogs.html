<lift:surround with="common-layout" at="content">

  <head_merge>
    <title>Rudder - Change logs</title>
    <link type="text/css" rel="stylesheet" data-lift="with-cached-resource" href="/style/rudder/rudder-changelogs.css" media="screen">
    <link type="text/css" rel="stylesheet" data-lift="with-cached-resource" href="/javascript/libs/jsondiffpatch/lib/formatters/styles/html.css" />
  </head_merge>
  <div class="rudder-template">
    <div class="one-col">
      <div class="main-header">
        <div class="header-title">
          <h1>
            <span>Change logs</span>
          </h1>
        </div>
        <div id="filterLogs">
          Get change logs between
          <input type="text" class="pickStartInput form-control input-xs"/>
          and
          <input type="text" class="pickEndInput form-control input-xs"/>
          <button id="filterLogsButton" type="button" class="btn btn-default btn-sm">Get changes</button>
          <span id="limitEventDisplayer"></span>
        </div>
        <span id="changeLogsError"></span>
      </div>
      <div class="one-col-main">
        <div class="template-main">
          <div class="main-container">
            <div class="main-details">
              <div class="inner-portlet">
                <div class="portlet-content">

                  <table id="changeLogsGrid" class="display" cellspacing="0"></table>

                  <div id="changeDetailPopup" class="d-none">
                    <lift:ignore>
                      This div gets the content of the changeDetailPopup injected within
                    </lift:ignore>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="rollbackBlock d-none">
    <div id="rollbackDisplay">
      <div class="callout-fade callout-info rollbackCallout my-2">
        <div class="marker">
          <span class="fa fa-exclamation-triangle"></span>
        </div>
        <h4>Restore previous state of item</h4>
        <div id='{{rollbackItemId}}' class="d-flex flex-wrap align-items-center justify-content-between column-gap-3 row-gap-2">
          <em>Restore this item to its state before this change:</em>
          <button class="btn btn-default" id='{{rollbackBtnId}}'>Restore</button>
        </div>
        <div id='{{confirmItemId}}'></div>

        <div class="rollbackAll mt-3 pt-2">
          <a class="text-secondary text-decoration-none" data-bs-toggle="collapse" href="#{{restoreConfigurationId}}" aria-expanded="false" aria-controls="{{restoreConfigurationId}}">
            <i class="fa fa-caret-down"></i>
            Rollback all configuration
          </a>
          <span class="fa fa-exclamation-triangle text-warning ms-1" aria-label="Warning:" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-html="true" data-bs-original-title="<h4 class='tags-tooltip-title'>Rollback all configuration</h4><div class='tooltip-inner-content'>This restores <b>all</b> the Rudder configuration to the state it had at the point in time that was preceding (before) or following (after) this change. This discards every change made since then.<br>This feature will be deprecated in a future version.</div>"></span>
          <div class="collapse" id="{{restoreConfigurationId}}">
            <div id='{{rollbackConfigurationId}}' class="d-flex flex-wrap align-items-center justify-content-between column-gap-2 row-gap-2 mt-2">
              <div>
                <span>Restore all configuration policy to the state it had:</span>

                <div class="btn-group" role="group" aria-label="Rollback actions">
                  <input type="radio" class="btn-check radio-btn" name='{{actionRadioName}}' id='{{beforeRadioId}}' value="before" autocomplete="off">
                  <label class="btn btn-outline-secondary" for='{{beforeRadioId}}'>Before</label>

                  <input type="radio" class="btn-check radio-btn" name='{{actionRadioName}}' id='{{afterRadioId}}' value="after" autocomplete="off" checked>
                  <label class="btn btn-outline-secondary" for='{{afterRadioId}}'>After</label>
                </div>
              </div>
              <button class="btn btn-default ms-2" id='{{restoreBtnId}}'>Restore</button>
            </div>
            <div id='{{confirmConfigurationId}}'></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="lift:configuration.ChangeLogsViewer.display"></div>

</lift:surround>
