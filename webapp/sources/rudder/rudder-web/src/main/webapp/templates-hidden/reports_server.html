<batches-list>
  <lift:authz role="node_write">
    <div class="d-flex flex-column">
      <div class="btn-toolbar trigger-agent-actions" role="toolbar">
        <runAgentInventory></runAgentInventory>
        <runAgent></runAgent>
      </div>
      <div class="outputContainers mb-3">
        <div id="reportInventory" class="mt-2 mb-0 alert collapse">
          <pre></pre>
        </div>
        <div id="report" class="mt-2 mb-0 alert collapse">
          <pre></pre>
        </div>
      </div>
    </div>
  </lift:authz>
  <lastreportgrid-intro></lastreportgrid-intro>


  <lift:authz role="node_read">
    <lift:authz role="compliance_read">
      <div>
        <button id="AllLogButton">Show logs</button>
      </div>
    </lift:authz>
  </lift:authz>

  <lift:authz role="node_read">
    <lift:authz role="compliance_read">
      <div id="logRun" class="mb-3" style="display:none;">
        <button id="AllLogHideButton" class="btn btn-primary">Hide logs<i class="ms-2 fa fa-table"></i></button>
        <h3 class="page-title my-2">All logs for current run</h3>
        <table id="complianceLogsGrid">
        </table>
      </div>
      <lastreportgrid-missing></lastreportgrid-missing>
      <lastreportgrid-unexpected></lastreportgrid-unexpected>
    </lift:authz>
  </lift:authz>

  <lastreportgrid-grid></lastreportgrid-grid>


</batches-list>
