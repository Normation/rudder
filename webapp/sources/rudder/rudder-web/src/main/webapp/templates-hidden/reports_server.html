<batches-list>
  <lift:authz role="node_write">
    <div class="d-flex flex-column mb-3">
      <div class="btn-toolbar" role="toolbar">
        <runAgentInventory></runAgentInventory>
        <runAgent></runAgent>
      </div>
      <div>
        <div id="reportInventory" class="my-2 alert collapse">
          <pre></pre>
        </div>
        <div id="report" class="my-2 alert collapse">
          <pre></pre>
        </div>
      </div>
    </div>
  </lift:authz>
  <lastreportgrid-intro></lastreportgrid-intro>


  <lift:authz role="node_read">
    <lift:authz role="compliance_read">
      <button id="AllLogButton">Show logs</button>
    </lift:authz>
  </lift:authz>

  <lift:authz role="node_read">
    <lift:authz role="compliance_read">
      <div id="logRun" class="mt-3" style="display:none;">
        <h3 class="page-title space-top">All logs for current run</h3>
        <button id="AllLogHideButton" class="btn btn-primary">Hide logs</button>
        <table id="complianceLogsGrid">
        </table>
      </div>
      <lastreportgrid-missing></lastreportgrid-missing>
      <lastreportgrid-unexpected></lastreportgrid-unexpected>
    </lift:authz>
  </lift:authz>

  <lastreportgrid-grid></lastreportgrid-grid>


</batches-list>
