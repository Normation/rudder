get:
  summary: Download a node's policy file
  description: Apache serves files from each managed node's policy directory over HTTPS.
  servers:
    - url: "https://{policyServer}"
      variables:
        policyServer:
          default: rudder.example.com
          description: Hostname of the node's policy server
  security:
    - nodeCertificate: []
  operationId: getNodePolicyFile
  parameters:
    - $ref: "../components/parameters/node-id.yml"
    - name: path
      in: path
      required: true
      description: File path relative to the node's policy directory. Use a slash between directory names.
      schema:
        type: string
      example: rules/cfengine-community/promises.cf
  responses:
    "200":
      description: File content
      content:
        "*/*":
          schema:
            type: string
            format: binary
  tags:
    - Policies
